<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentWorks browser connection</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>Connect your Chrome</h1><p>In AgentWorks, open Browser settings and choose Connect Chrome. Paste the connection below.</p><label for="pairing">Connection</label><textarea id="pairing" rows="3" placeholder="Paste your connection"></textarea><button id="connect">Connect</button><p id="status" role="status" aria-live="polite">Not connected</p><p id="error" role="alert"></p><section id="controls" hidden><p>Shared tabs can be read and controlled by this workspace. Page contents and screenshots are sent to the platform.</p><button id="share">Share current tab</button><ul id="tabs"></ul><button id="stop" class="stop">Stop and disconnect</button></section></main><script src="popup.js" type="module"></script></body></html>
