schema_version: 2

# AgentWorks chat capability admission is owned here. Tool implementations stay
# in Go; registration, guidance and native-session identity use the resolved policy.
dependencies: {}

prompt:
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: agentworks
  name: AgentWorks
  version: 1
  # Global, not project: AgentWorks has no single fixed workspace to bind
  # to -- a real AgentWorks session moves between whichever workflow the
  # user is working in, the same dynamic multi-agent behavior the platform
  # already gives a normal (no agent-profile) session. Project scope's
  # "one fixed prompt/workspace" model, which every other product.yaml
  # today uses on purpose, is the wrong shape for AgentWorks specifically.
  scope: global
  built_in: true
  # Slash commands the builder ships with itself. Each prompt lives in its
  # own file under commands/; `{{context}}` is replaced with whatever the
  # user typed before the slash (for run-technical-review, the resolved review focus
  # plus that text). /pulse stays a hardcoded builtin: it is an async
  # frontend API call no static prompt can express.
  commands:
    # Pulse keeps two chat commands: /pulse (builtin) and /run-goal-work, which
    # takes a focus. Plan Drift, Technical and Architecture are started from
    # the Pulse tab (its buttons execute these hidden commands, one prompt per
    # action) or automatically by fix runs.
    - name: design-plan
      description: Comprehensively review the plan, dependent artifacts, and better design options
      icon: git-branch
      file: commands/design-plan.md
    - name: run-plan-drift
      description: Check the plan still fits its steps, reports and schedules; fix small breaks
      icon: refresh-cw
      aliases: [review-artifact-drift]
      menu_hidden: true
      file: commands/run-plan-drift.md
    - name: design-dashboard
      description: 'Design the dashboard from scratch: one live-data HTML dashboard at db/reports/index.html'
      icon: check-circle
      aliases: [design-reporting-ui]
      file: commands/design-dashboard.md
    - name: setup-goals
      description: Set up outcome goals, primary and supporting metrics, and progress tracking
      icon: target
      aliases: [define-success]
      file: commands/setup-goals.md
    - name: run-goal-work
      description: Find and do the work that would move your goals
      icon: target
      aliases: [strategy-auditor, goal-advisor]
      file: commands/run-goal-work.md
    - name: run-technical-review
      description: Find and fix what is broken in runs, validation, reports and stores
      icon: check-circle
      aliases: [pulse-review]
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: run-architecture-review
      description: Research better ways to structure the workflow; proposes, never edits
      icon: git-branch
      menu_hidden: true
      file: commands/run-architecture-review.md
    - name: review-code
      description: Review saved code and JSON parameters; propose code/ migration with focused tests
      icon: file-text
      file: commands/review-code.md
    - name: backup
      description: Set up, run, or restore this automation's backup
      icon: cloud
      file: commands/backup.md
    - name: publish
      description: Set up or publish this automation's report to a public URL
      icon: globe
      file: commands/publish.md
    - name: notify
      description: Set up, review, or test agentic notifications
      icon: bell-ring
      file: commands/notify.md
    # Retained pulse-review-* focus shortcuts: executable under access checks,
    # without menu rows. All share the run-technical-review prompt; the client
    # resolves each name to its fixed focus before submitting.
    - name: pulse-review-execution-health
      description: 'Pulse review: execution health'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: pulse-review-validation-contract
      description: 'Pulse review: validation contracts'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: pulse-review-report-quality
      description: 'Pulse review: dashboard quality'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: pulse-review-evaluation-quality
      description: 'Pulse review: measurement quality'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: pulse-review-database
      description: 'Pulse review: database integrity'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: pulse-review-knowledge
      description: 'Pulse review: knowledgebase'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md
    - name: pulse-review-learnings
      description: 'Pulse review: learnings'
      icon: check-circle
      menu_hidden: true
      file: commands/run-technical-review.md

branding:
  icon: ""
  favicon: ""

ui:
  surface: ""
  files_panel: false
  workflow_panel: false
  secrets: false
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""

# Mode is derived from authenticated workflow access, never selected by the
# client: owner/write use Builder and read-only uses Run. Origin is provenance
# only and may narrow that access-derived capability set.
chat_policy:
  modes:
    builder: &builder_capabilities
      - user_management
      - mcp_management
      - mcp_inspection
      - plan_authoring
      - report_authoring
      - secret_management
      - knowledgebase_maintenance
      - workflow_suggestions
      - improvement_proposals
      - workspace_ui
      - bot_management
    # mcp_inspection: list the MCP servers and their connection status (no
    # changes), so a Run chat can tell which of its tools are connected.
    run: [workspace_ui, bot_management, workflow_suggestions, mcp_inspection]
  origins:
    external_builder: [plan_authoring]
    interactive: *builder_capabilities
    # Unattended execution and post-run Pulse share the same authority.
    # Neither stage admits connection/user/bot management or live workspace UI.
    scheduled: &scheduled_capabilities [plan_authoring, report_authoring, secret_management, knowledgebase_maintenance, improvement_proposals, workflow_suggestions]
    pulse: *scheduled_capabilities
    child: [plan_authoring, report_authoring, secret_management, knowledgebase_maintenance, improvement_proposals]
    bot: *builder_capabilities
    notification: *builder_capabilities
  read_only: [workspace_ui, bot_management, workflow_suggestions, mcp_inspection]

# The workflow Pulse agent (PLAT-697): it reads the workflow, keeps its own
# records and talks to the Builder chat (ask_builder), which runs and changes
# things within Pulse's permission levels. These are the only tools it gets,
# and the only workflow folders it may write; the rest is read-only to it.
# execute_shell_command stays because a coding CLI reaches its tools through it.
pulse:
  # Pulse's own skill pack ("pulse"), loaded with read_skill(name="pulse").
  skills:
    - goal-lead-check
    - goal-lead-work
    - goal-lead-memory
    - goal-lead-tickets
    - goal-lead-inspect
