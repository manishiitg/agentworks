      - send_step_message
      - stop_all_executions
      - stop_step
      - test_slack_bot_connection
      - trigger_schedule
    # Withheld from direct external invocation and from token-backed Run
    # sessions; Slack/WhatsApp Run channels keep them. runs:execute authority,
    # stated precisely: a token may invoke the
    # run operations of the workflows it can see, converse with those
    # workflows' Run-mode assistant, and trigger those workflows' own saved
    # schedules. "Never authors" means no plan, configuration, schedule,
    # secret, or file change outside the run's own execution outputs;
    # executing a run still performs the workflow's configured steps,
    # including its configured notifications. Only account-scoped tools
    # are withheld: google_workspace_cli runs arbitrary commands against
    # the account's default Google connection, which is not bound to any
    # workflow; list_mcp_servers is the platform's MCP inventory. Deliberately kept: send_slack_message (configured workflow
    # routes only; arbitrary channels are rejected), notify_user (the
    # user's own channels), trigger_schedule (this workflow's own
    # schedules). Adding a name here is a deliberate API change; pinning
    # test: TestExternalRunAuthorityBoundary.
    external_denylist:
      - google_workspace_cli
      - list_mcp_servers
    # External-native tools: scoped readers plus run operations with no chat
    # equivalent, each with a server implementation. The run-mode `tools`
    # list above is the single source of truth for the run surface and is
    # additionally exposed except the denylist (see RunTools): names with a
    # native implementation keep it, the rest are proxied to a pinned
    # Run-mode session. A name here without an implemented external tool
    # fails server startup, as does an implemented tool missing from both
    # lists. Admitting an authoring mutation here is a deliberate API
    # change: this list remains read/run. Builder has its own scoped external_tools.
    external_tools:
      - list_workflows
      - get_workflow
      - list_files
      - search_files
      - list_step_code
      - get_file_link
      - read_file
      - get_plan
      - get_agent_context
      - list_guidance_topics
      - get_guidance_topic
      - list_workflow_knowledge
      - read_workflow_knowledge
      - list_runs
      - get_run
      - get_logs
      - run_status
      - chat
      - run_reply_input
      # Workflow functions (function triggers): typed calls with checked inputs.
      - list_workflow_functions
      - call_workflow_function
      - get_workflow_function_call
      - reply_workflow_function_call
      # Suggestions for the owner (reviewed in the decisions panel; change nothing).
      - suggest_workflow_change
      # Crews (crews:read / crews:run, bounded by the token's Crew list).
      - list_crews
      - get_crew
      - list_crew_files
      - search_crew_files
      - read_crew_file
      - list_crew_functions
      - call_crew_function
      - ask_crew
      - get_crew_function_call
      - reply_crew_function_call
      - suggest_crew_change
      # Crew authoring (crews:write; only the owner edits; export is crews:read).
      - create_crew
      - update_crew
      - export_crew
      - import_crew
      # Vault management: active administrators only, with vault:manage consent.
      # Code review (code:review; admins and Code reviewers; read-only, audited).
      - list_code_workspaces
      - get_code_costs
      - list_code_files
      - read_code_file
      - list_code_chats
      - read_code_chat
      - get_code_audit
      # Shared-account token limits (get: code:review or users:manage; set: users:manage, admins; audited).
      - get_token_usage
      - set_token_limits
    prompt:
      file: prompts/run.md
      includes: [prompts/workflow-shared.md]
    skills: [system-tools, builder-reference, workflow-ui-control]

