schema_version: 2

# AgentWorks chat capability admission is owned here. Tool implementations stay
# in Go; registration, guidance and native-session identity use the resolved policy.
dependencies: {}

# The workflow execution agent's server-owned function-call surface. Go owns
# schemas, executors and authorization; this declaration owns admission/grouping.
execution:
  function_tools:
    category: crew_function_tools
    tools: [project_functions_list, project_functions_call, project_functions_get_call, project_functions_reply]

prompt:
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: agentworks
  name: AgentWorks
  version: 1
  # Global, not project: AgentWorks has no single fixed workspace to bind
  # to -- a real AgentWorks session moves between whichever workflow the
  # user is working in, the same dynamic multi-agent behavior the platform
  # already gives a normal (no agent-profile) session. Project scope's
  # "one fixed prompt/workspace" model, which every other product.yaml
  # today uses on purpose, is the wrong shape for AgentWorks specifically.
  scope: global
  built_in: true
  commands:
    - name: design-dashboard
      description: Design this workflow's dashboard from its real data
      icon: check-circle
      file: commands/design-dashboard.md
    - name: run
      description: Run the workflow, or one step, now
      icon: play
      file: commands/run.md
    - name: fix
      description: Look at the last failed run and fix the workflow
      icon: wrench
      file: commands/fix.md
    - name: schedule
      description: Set when it runs by itself and what it reacts to
      icon: calendar
      file: commands/schedule.md
    - name: share
      description: Share the dashboard with everyone, chosen people or only you
      icon: share-2
      file: commands/share.md
    - name: connect
      description: Let people reach it from Slack and other AI tools
      icon: plug
      file: commands/connect.md
    - name: notify
      description: Choose who gets the summaries, and where
      icon: bell-ring
      file: commands/notify.md
    - name: upgrade
      description: Bring the workflow up to date with the platform
      icon: layers
      file: commands/upgrade.md

branding:
  icon: ""
  favicon: ""

ui:
  tips:
    - id: dashboards-library
    - id: quick-switcher
    - id: toolbar-hide
  surface: ""
  files_panel: false
  workflow_panel: false
  secrets: false
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""

# Mode is derived from authenticated workflow access, never selected by the
# client: owner/write use Builder and read-only uses Run. Origin is provenance
# only and may narrow that access-derived capability set.
chat_policy:
  modes:
    builder: &builder_capabilities
      - user_management
      - mcp_management
      - mcp_inspection
      - plan_authoring
      - report_authoring
      - secret_management
      - workflow_suggestions
      - improvement_proposals
      - workspace_ui
      - bot_management
    # mcp_inspection: list the MCP servers and their connection status (no
    # changes), so a Run chat can tell which of its tools are connected.
    run: [workspace_ui, bot_management, workflow_suggestions, mcp_inspection]
  origins:
    # The owner (or an editor) over MCP is the same Builder as on the website.
    external_builder: *builder_capabilities
    interactive: *builder_capabilities
    # The person's own automatic turns get everything their typed turns get (owner, 5 Nov), so a chat's
    # tools never change by who started the turn.
    scheduled: *builder_capabilities
    child: *builder_capabilities
    bot: *builder_capabilities
    notification: *builder_capabilities
  read_only: [workspace_ui, bot_management, workflow_suggestions, mcp_inspection]

# Prompt text stays in Markdown. Includes contain named Go-template definitions;
# the entry file chooses which definitions to render. Runtime values stay in Go.
