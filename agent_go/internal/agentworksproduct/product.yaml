    - query_workflow_costs
    - get_cost_summary
    - get_step_prompts
    - get_plan_prompt_health
    - get_workflow_config
    - get_llm_config
    - list_executions
    - get_schedule_runs
    - list_schedules
    - query_step
    - get_notification_history
    - get_human_input_request
    - list_skills
    - search_skills
    - get_workflow_command_guidance
    - get_file_link
    - get_report_link
    - read_image
    - read_crew_calls
    - search_platform
    - search_playbooks
    - brain_browse
    - brain_access
    - list_accessible_workflows
    - get_contract_upgrades
    - execute_shell_command
    - record_pulse_goal_check
    - record_pulse_goal_memory
    - record_pulse_recommendation
    - record_pulse_decision_outcome
    - record_pulse_focus_area
    - record_pulse_qa_request
    - record_pulse_goal_work
    - record_pulse_result
    - record_pulse_worklist
    - record_pulse_next_run
    - record_pulse_fast_request
