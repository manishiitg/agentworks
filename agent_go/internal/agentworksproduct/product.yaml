    prompt:
      file: prompts/builder.md
      includes: [prompts/workflow-shared.md]
    skills: [system-tools, builder-reference, workflow-ui-control, workflow-commands, panel-dashboard, panel-data, panel-plan, panel-runs, panel-settings, panel-automations, panel-channels, panel-access]
  run:
    # Default workflow phase tools; integration tests compare real registration.
    tools:
      - project_functions_list
      - project_functions_call
      - project_functions_get_call
      - project_functions_reply
      # Coding providers reach the admitted APIs through the guarded shell.
      # These bridge tools stay out of the direct external Run API below.
      - execute_shell_command
      - diff_patch_workspace_file
      - list_llm_capabilities
      - query_workflow_db
      - query_workflow_costs
      - brain_browse
      - brain_read
      - brain_update
      - brain_skills
      - brain_access
      - agent_browser
      - execute_step
      - get_contract_upgrades
      - get_cost_summary
      - get_file_link
      # files action=read/list/search: reading a workflow file is basic (PLAT-856-397).
      - get_llm_config
      - get_report_link
      - get_schedule_runs
      - get_slack_bot_settings
      - slack
      - get_step_prompts
      - preview_step_runtime
      - send_message
      - read_agent_messages
      - list_agents
      - submit_workflow_suggestion
      - get_ui_state
      - get_workflow_command_guidance
      - get_workflow_config
      - get_workflow_team
      - read_team_source
      - list_executions
      - list_mcp_servers
      - list_schedules
      - list_secrets
      - list_skills
      - list_ui_capabilities
      - perform_ui_action
      - human_feedback
      - send_email
      - send_slack_message
      - google_workspace_cli
      - query_step
      - request_workflow_folder_access
      - run_full_workflow
      - search_skills
      - send_step_message
      - stop_all_executions
      - stop_step
      - test_slack_bot_connection
      - trigger_schedule
    # Withheld from direct external invocation and from token-backed Run
    # sessions; Slack/WhatsApp Run channels keep them. runs:execute authority,
    # stated precisely: a token may invoke the
    # run operations of the workflows it can see, converse with those
    # workflows' Run-mode assistant, and trigger those workflows' own saved
    # schedules. "Never authors" means no plan, configuration, schedule,
    # secret, or file change outside the run's own execution outputs;
    # executing a run still performs the workflow's configured steps,
    # including its configured notifications. Only account-scoped tools
    # are withheld: google_workspace_cli runs arbitrary commands against
    # the account's default Google connection, which is not bound to any
    # workflow; list_mcp_servers is the platform's MCP inventory; send_email emails any address the caller
    # names, which a token must not do in the workflow's name (PLAT-736). Deliberately kept: send_slack_message (configured workflow
    # routes only; arbitrary channels are rejected), trigger_schedule (this workflow's own
    # schedules). Adding a name here is a deliberate API change; pinning
    # test: TestExternalRunAuthorityBoundary.
    external_denylist:
      - execute_shell_command
      - diff_patch_workspace_file
      - list_llm_capabilities
      - query_workflow_db
      - query_workflow_costs
      - google_workspace_cli
      - list_mcp_servers
      - send_email
      # Builder and step tools that are not MCP entry points (PLAT-746-467): runs
      # never ask a person, and contract upgrades and team sources stay in the Builder.
      - human_feedback
      - get_contract_upgrades
      - read_team_source
    # External-native tools: scoped readers plus run operations with no chat
    # equivalent, each with a server implementation. The run-mode `tools`
    # list above is the single source of truth for the run surface and is
    # additionally exposed except the denylist (see RunTools): names with a
    # native implementation keep it, the rest are proxied to a pinned
    # Run-mode session. A name here without an implemented external tool
    # fails server startup, as does an implemented tool missing from both
    # lists. Admitting an authoring mutation here is a deliberate API
    # change: direct file writes require their own scope; plans remain Builder-owned.
    external_tools:
      - get_dashboard_catalog
      - upload_dashboard_asset
      - list_dashboards
      - get_dashboard
      - open_dashboard
      - create_dashboard
      - update_dashboard
