schema_version: 2

# SparkQuill: a parent and their child, on one account, with one guide
# ("Quill"). The parent profile is the product's conversation; the child
# profile runs inside one activity folder at a time, behind the parent's PIN,
# and never sees the rest of the workspace.
#
# This manifest is SparkQuill. The standalone family server it replaced
# (cmd/family-server, deleted September 2026) is gone; the family tools are
# product tool factories (tools.go). WhatsApp is the platform's shared
# connector with this profile as the default destination (runtime
# capability `whatsapp`), not the old dedicated bot. Not carried over:
# send_whatsapp_file and the desktop notification channel.
#
# Layout under the family root (Chats/SparkQuill): activities/<slug>/ holds
# every activity (activity.json + product.json, which makes the folder the
# child's own conversation), plus materials/, memory/, reports/, inbox/,
# archive/.
dependencies: {}

# External clients receive only the family-scoped MCP catalog.
chat:
  run:
    prompt:
      file: prompts/parent.md
    external_tools:
      - get_learning_context
      - get_learning_progress
      - list_materials
      - read_material
      - list_activities
      - list_files
      - read_file
      - get_file_link
      - create_file
      - update_file
      - upload_file
      - create_learning_activity
      - update_learning_activity
      - get_activity_status
      - finalize_activity
      - assign_activity

prompt:
  file: prompts/parent.md
  variables: {}

profile:
  id: sparkquill
  name: SparkQuill
  version: 1
  # project scope with a fixed root: the folder guard and the strict sandbox
  # apply to a project-scoped profile, and workspace secrets are attached;
  # global scope gets neither.
  scope: project
  skills:
    - image-prompting
    - read-file
    - process-file
    - recall-conversations
    - create-progress-report
    - learning-game
    - animated-learning-video
    - reading-book
    - publish
    - backup
  tools:
    - id: sparkquill.set-child-profile
    - id: sparkquill.set-parent-label
    - id: sparkquill.pin-page
    - id: sparkquill.unpin-page
    - id: sparkquill.create-learning-activity
    - id: sparkquill.open-file
      presentation:
        kind: document.file
        activity: {label: File opened, destination: Viewer, detail: Shown on the right}
    - id: sparkquill.open-activity
      presentation:
        kind: sparkquill.activity
        activity: {label: Activity ready, destination: Viewer, detail: Ready to hand over}
    - id: platform.suggest-actions
      interaction:
        kind: suggestions
        render: chat.suggestions
  commands:
    - name: create-learning-game
      description: "Create a learning game"
      prompt: "Create a complete, immersive learning game for my child about the topic I specify or we are working on. Follow your learning-game skill. Choose a genre, mechanics and scope that fit my child's level and interests, with meaningful gameplay, polished visuals, responsive controls, feedback and progression. Substantial games are welcome; choose the number of levels yourself. Finish and play-check it, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-interactive-quiz
      description: "Create an interactive quiz"
      prompt: "Create an engaging, playable quiz for my child about the topic I specify or we are working on. Follow your learning-game skill. Choose an experience that fits my child's level and interests and makes answers influence what happens, with useful feedback and recovery from mistakes. Choose the format and depth yourself, finish and play-check it, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-animated-video
      description: "Create an animated video"
      prompt: "Create a complete animated explainer video for my child on the topic I specify or we are working on. Follow your animated-learning-video skill and use HyperFrames. Match my child's language and level, with visuals that explain the idea, captions, a transcript and a recap. Choose the length and style that fit the lesson unless I specify them. Render and check the playable video, then show the finished activity for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-reading-book
      description: "Create a reading book"
      prompt: "Create a complete illustrated reading book for my child on the topic I specify or we are working on. Follow your reading-book skill. Match my child's reading level and language, with a cover, numbered pages, Previous and Next controls and a satisfying ending or recap. Choose the length that fits the material unless I specify it. Finish all pages, check the reading experience, then show the activity for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-study-material
      description: "Create study material"
      prompt: "Create a complete study activity for my child on the topic I specify or we are working on. Use the known grade, language and school material to choose the depth, with clear explanations, worked examples, useful practice and a recap. Finish and check it, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-study-material-ib
      description: "Study material (IB style)"
      prompt: "Create a complete study activity for my child in IB style on the topic I specify or we are working on. Use the known grade and programme and supplied school material, with concept-based inquiry, appropriate command terms, worked examples, practice and a recap. Verify current syllabus details when needed. Finish and check it, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-study-material-cbse
      description: "Study material (CBSE style)"
      prompt: "Create a complete study activity for my child in CBSE style on the topic I specify or we are working on. Use the known grade and supplied school material for NCERT-aligned explanations, worked examples, competency and case-based practice and a recap. Verify current syllabus details when needed. Finish and check it, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-study-material-icse
      description: "Study material (ICSE style)"
      prompt: "Create a complete study activity for my child in ICSE style on the topic I specify or we are working on. Use the known grade and supplied school material for clear definitions, worked examples, application practice and a recap. Verify current syllabus details when needed. Finish and check it, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: create-a-practice-test
      description: "Create a practice test"
      prompt: "Create a complete practice test for my child on the topic I specify or we are working on. Match the known grade, board and requested coverage and difficulty. Use my stated help and time limits; ask only for necessary missing decisions. Keep the answer key and marking notes parent-only, outside the child's activity. Check the questions and answers, then show the test for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: surprise-her
      description: "Surprise her with something new"
      prompt: "Surprise my child with a complete, immersive learning game about something fun and new to discover. Follow your learning-game skill. Choose a topic, genre and scope that fit my child's level and interests, with meaningful actions, visual feedback and progression. Finish and play-check the game, then show it for my preview.\n\nAdditional context from me (optional): {{context}}"
    - name: update-progress-report
      description: "Update progress report"
      prompt: "Update the Progress page from real learning evidence by following your create-progress-report skill. Tell me briefly what has improved, where help is needed and a useful next step. Be clear when there is too little evidence to judge.\n\nAdditional context from me (optional): {{context}}"
    - name: run-check-in
      description: "Run check-in now"
      prompt: "Run a check-in now: review my child's recent learning and school subjects from real evidence, check my watched school websites if any, refresh the Progress page and tell me what changed or needs attention. Use saved credentials when needed. Keep the summary grounded in what you actually found.\n\nAdditional context from me (optional): {{context}}"
    - name: check-school-websites
      description: "Check school websites"
      prompt: "Check my watched school websites now, using saved credentials when needed. Tell me what is new or needs attention: homework, grades, notices and deadlines. Distinguish new findings from older notices and say if a site could not be checked.\n\nAdditional context from me (optional): {{context}}"
    - name: back-up-workspace
      description: "Back up workspace"
      prompt: "Back up my workspace now by following your backup skill. Verify the result and tell me whether it succeeded or what is needed to finish.\n\nAdditional context from me (optional): {{context}}"
  tool_policy:
    mode: allowlist
    enabled:
      - execute_shell_command
      - diff_patch_workspace_file
      - read_image
      - agent_browser
      - list_secrets
      - set_workflow_secret
      - delete_workflow_secret
      - set_child_profile
      - set_parent_label
      - pin_page
      - unpin_page
      - create_learning_activity
      - open_file
      - open_activity
      - suggest_actions
      - image_gen
      - image_edit
  runtime:
    transport: auto
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5-5
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: high
      - id: codex-cli
        label: Codex
        provider: codex-cli
        model_id: gpt-6.1-sol
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: medium
        default: true
      - id: agy-cli
        label: Antigravity CLI (Alpha)
        provider: agy-cli
        model_id: gemini-3.8-flash-high
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: high
    agent_tools:
      mode: full
    capabilities:
      live_input: preferred
      raw_terminal: disabled
      warm_session: preferred
      browser: preferred
      voice: preferred
      # The chats rail's own "New chat" button drives this (it dispatches the
      # same agentworks:product-new-conversation event); disabled so the
      # generic composer control doesn't duplicate it.
      new_conversation: disabled
      # The parent's own WhatsApp ("message yourself") reaches Quill directly:
      # pairing from SparkQuill makes this profile the account's default
      # WhatsApp destination, so no @slug prefix is ever needed. The
      # connector itself is the platform's.
      whatsapp: preferred
    workspace:
      mode: fixed
      root: Chats/SparkQuill
    conversation:
      mode: singleton
    sandbox:
      mode: strict
      network: allowed
      read_only: [Downloads]
  ui_panels:
    schedules: true
    files: true
  schedules:
    - id: pulse
      name: Check-in
      description: Quill reviews the child's progress, school subjects and watched school websites, rebuilds the holistic progress page, saves a summary in the check-in history.
      enabled: false
      # Its own conversation, session and coding-CLI process — never the
      # parent's live chat. Without this a scheduled run reused that exact
      # session, so a check-in firing while the parent was mid-chat collided
      # on the same tmux-backed process. Its turns are invisible to the
      # parent's own transcript; the parent reviews the saved check-in
      # history and Progress tab.
      isolated: true
      cadence_hours: 24
      quiet_minutes: 10
      max_deferral_hours: 4
      messages:
        - "This is an automated check-in, in your own separate check-in history — not the parent's chat, which cannot see this. Your main job: check the child's progress and school subjects from real evidence in the workspace (activities, attempts, materials, school papers), check the watched school website(s) with agent_browser - call agent_browser(command=\"status\") first, log in with saved secrets where needed, check memory/browser-notes.md before navigating and save what you learn there - and rebuild the holistic progress page at reports/progress.html by following your create-progress-report skill — full regeneration every time, with today's date inside. Cover every subject with evidence, what she can and cannot do yet, and what to work on next. Then write ONE short, warm message as your reply (the parent is not technical; no files, paths or JSON)."
        - "This automated check-in is done and the progress page is rebuilt. Decide what is ACTUALLY worth telling the parent, lead with what matters most — what changed, the one gap to act on — and save a brief plain summary (1-3 sentences) in this check-in history, pointing at the refreshed Progress tab. If nothing meaningful happened, say so. This summary stays in the check-in history; do not claim a notification was sent."
  built_in: true

profiles:
  - id: sparkquill-child
    name: SparkQuill Child
    version: 1
    scope: project
    prompt:
      file: prompts/child.md
      variables: {}
    skills:
      - image-prompting
    tools:
      - id: sparkquill.open-activity-file
        presentation:
          kind: document.file
          activity: {label: Page opened, destination: Viewer, detail: Shown on the right}
      - id: sparkquill.celebrate
        interaction:
          kind: celebrate
          render: chat.celebration
      - id: sparkquill.show-scene
        interaction:
          kind: scene
          render: chat.scene
    commands:
      - name: score-by-answer
        description: "Score by answer"
        prompt: "Review the questions I have actually answered in this activity. Use my real answers and the activity's marking and help rules; do not invent missing answers or scores. During exam conditions, wait until the test ends to give marks or reveal answers. When review is allowed, show which answers are right, explain mistakes at my level and give the score for the work you could check.\n\nAdditional context from me (optional): {{context}}"
      - name: recap
        description: "Recap"
        prompt: "Recap how I am doing in this activity from what I have actually done: what I have finished, what I am getting right, where I need help and a useful next step. Keep it short and encouraging; do not invent a score or progress.\n\nAdditional context from me (optional): {{context}}"
      - name: walk-me-through-my-mistakes
        description: "Walk me through my mistakes"
        prompt: "Help me learn from the questions I got wrong in this activity, one at a time. Use what I actually answered, help me spot the mistake with a hint and let me try again before moving on. Respect the activity's test and help rules; if solutions must stay hidden, use a similar example. At the end, explain any pattern the evidence supports.\n\nAdditional context from me (optional): {{context}}"
      - name: check-strictly
        description: "Check strictly"
        prompt: "Check the accuracy of my last answer carefully and explain errors clearly at my level when the activity allows feedback. Respect its marking, help and timing rules, including waiting until the end under exam conditions. I may answer by voice, so ignore transcription spelling slips and judge what I meant unless spelling is being tested.\n\nAdditional context from me (optional): {{context}}"
      - name: keep-quizzing-me-harder-each-time
        description: "Adaptive quiz"
        prompt: "Quiz me adaptively within this activity, one question at a time, at a level suited to my grade and what I have shown so far. Adjust difficulty from my answers and help me understand mistakes according to the activity's help rules. Respect any test conditions and time limits. When I stop or we reach a natural stopping point, give a short evidence-based recap and a useful next step.\n\nAdditional context from me (optional): {{context}}"
      - name: give-me-a-real-example
        description: "Give me a real example"
        prompt: "Give me a clear real-world example of the idea we are discussing in this activity, using something suited to my age and interests. Respect the activity's help rules; use a similar problem if an assessed answer must stay hidden.\n\nAdditional context from me (optional): {{context}}"
    tool_policy:
      mode: allowlist
      enabled:
        - execute_shell_command
        - diff_patch_workspace_file
        - read_image
        - open_file
        - celebrate
        - show_scene
        - image_gen
        - image_edit
    runtime:
      transport: auto
      provider_options:
        - id: claude-code
          label: Claude Code
          provider: claude-code
          model_id: claude-sonnet-5-5
          reasoning_efforts: [low, medium, high]
          options:
            reasoning_effort: medium
        - id: codex-cli
          label: Codex
          provider: codex-cli
          model_id: gpt-6-luna
          reasoning_efforts: [low, medium, high]
          options:
            reasoning_effort: high
          default: true
        - id: agy-cli
          label: Antigravity CLI (Alpha)
          provider: agy-cli
          model_id: gemini-3.8-flash-high
          reasoning_efforts: [low, medium, high]
          options:
            reasoning_effort: high
      agent_tools:
        mode: full
      capabilities:
        live_input: preferred
        raw_terminal: disabled
        warm_session: preferred
        browser: disabled
        secrets: disabled
        voice: preferred
      workspace:
        # One conversation per activity: the activity folder is the project.
        mode: project
        projects_root: Chats/SparkQuill/activities
      conversation:
        mode: keyed
        key_type: project
      sandbox:
        # Deny-by-default: the activity folder only, no network, no secrets
        # in the environment: the child's shell boundary. The family's
        # conversation logs (the parent's chats with Quill included) stay
        # out of reach too.
        mode: strict
        network: disabled
        read_only: [Downloads]
        chat_history: none
    built_in: true

branding:
  icon: sparkles
  favicon: sparkles

ui:
  tips:
    - id: quick-switcher
    - id: toolbar-hide
  surface: sparkquill
  files_panel: true
  workflow_panel: false
  secrets: true
  streaming: structured

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""
