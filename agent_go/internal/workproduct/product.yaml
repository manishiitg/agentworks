schema_version: 2

# Crew's small product manifests hold only durable project/session metadata.
# MCP/tool policy and built-in skills stay here; coding happens in the
# automatically created project folder.
dependencies: {}

prompt:
  file: prompts/system-prompt.md
  variables: {}

# Access chooses the mode. Builder adds these skills to its feature bundle;
# Run replaces that bundle, while keeping the person's selected domain skills.
chat:
  builder:
    external_tools: [copy_project_files, get_file_link, computer_use, manage_crew_commands, crew_files, crew_skills, crew_mcp, crew_folders, crew_references, crew_diagnostics, crew_execution, crew_integrations, crew_owners]
    prompt: {file: prompts/system-prompt.md}
    skills: [chat-visuals, finance-work, customer-work, growth-work, sales-work, team-work, software-work, store-work, crew-builder, crew-agents, crew-laptop, panel-dashboard, panel-data, panel-plan, panel-settings, panel-runs, panel-automations, panel-channels, panel-access]
  run:
    prompt: {file: prompts/run.md}
    skills: [chat-visuals, crew-run, finance-work, customer-work, growth-work, sales-work, team-work, software-work, store-work]

profile:
  id: work
  name: Crew
  version: 3
  # Each shared feature expands into its existing tools, skills, prompt
  # extension, runtime capabilities and UI panels. This is the source of truth;
  # the compatibility fields returned by the profile API are derived from it.
  features:
    - live-chat
    - id: coding
      options: {review_skill: disabled}
    - files
    - browser
    - secrets
    - mcp
    - skills
    - knowledgebase
    - attached-folders
    - workflow-references
    - terminal
    - voice
    - models
    - id: schedules
      options: {mode: message_only}
    - condition-triggers
    - id: triggers
      options: {mode: message_only}
    - id: bots
      # Shared bots feature declares the Slack CLI API tool, tracked sends, and connector management.
      options: {channels: "slack,whatsapp,gmail"}
    - database
    - dashboard
    - memory
    - costs
    - background-work
    - workspace-ui
  # project scope, not global: global scope (1) makes provider_options
  # non-authoritative and (2) skips this
  # profile's own prompt.file in favor of the dynamic multi-agent
  # delegation prompt. Crew's prompt (plain coding work, no workflow
  # vocabulary) must actually reach the model.
  admin_inspection: true
  scope: project
  tools:
    - id: media.show-video
      presentation:
        kind: media.video
        activity: {label: "Video ready", destination: Dashboard, detail: Ready to review}
    - id: media.show-character
      presentation:
        kind: media.character
        activity: {label: "Character ready", destination: Dashboard, detail: Ready to review}
    - id: media.show-reference
      presentation:
        kind: media.reference
        activity: {label: "Reference ready", destination: Dashboard, detail: Ready to review}
    - id: media.show-document
      presentation:
        kind: document.markdown
        activity: {label: "Document ready", destination: Dashboard, detail: Ready to review}
    - id: work.create-project
      interaction:
        kind: project_created
        render: product.refresh
    - id: work.set-identity
      interaction:
        kind: identity_updated
        render: product.refresh
    - id: work.custom-commands
  # Crew reuses the platform coding and background-agent surfaces (shell,
  # guarded file patching, browser, secrets, web research, run_in_background).
  # Its only product-specific wrappers are folder grants and message-only
  # project schedules; workflow/plan/route/pulse tools remain excluded.
  tool_policy:
    mode: allowlist
    enabled:
      - show_video
      - show_character
      - show_reference
      - show_document
      - read_project_files
      - get_file_link
      - get_report_link
      # The Crew's agents are its tabs: open, list and message them, and set this tab's own name and purpose.
      - open_project_chat
      - list_project_chats
      - ask_project_chat
      - set_my_agent_identity
      # A coding agent's question card while a person is in the chat (owner, 2026-10-28).
      - request_clarification
    # Populated by features above. Not enabled, deliberately: workflow
    # schedule/route tools,
    # pulse/improvement tools, workflow-step orchestration, media-generation tools,
    # workflow configuration, and human_feedback /
    # summary delivery. mcpagent's own intrinsic tools (get_api_spec,
    # read_skill) are injected by mcpagent
    # itself and are not governed by this list.
  # Slash commands Crew ships with itself. The prompt lives in its own file
  # under commands/; `{{context}}` is replaced with whatever the user typed
  # before the slash. Invoking /update-memory is the user's explicit ask to
  # preserve reusable procedures, which is what unlocks skill changes under
  # the panel-data memory-vs-skill rules.
  commands:
    - name: update-memory
      description: Update project memory and skills from this conversation
      icon: brain
      file: commands/update-memory.md
    - name: daily-learnings
      description: End-of-day review of today's conversations — save new learnings to memory and skills
      icon: brain
      file: commands/daily-learnings.md
  runtime:
    # Managed data uses the same direct bridge in Builder and Run. Registration
    # and session access decide whether the database family has reads or writes.
    bridge_tools: [query_workflow_db]
    # Transport is selected by AgentWorks' shared execution policy: interactive
    # chats retain tmux, while background children and steps use structured JSON.
    transport: auto
    # Reuse AgentWorks' complete coding-agent provider set. These providers
    # launch the globally installed CLIs; Crew does not install, fork, or
    # maintain a separate copy of any runtime.
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5-5
        reasoning_efforts: [low, medium, high, max]
        options:
          reasoning_effort: high
        default: true
      - id: codex-cli
        label: Codex
        provider: codex-cli
        model_id: gpt-6-astra
        reasoning_efforts: [low, medium, high, xhigh, max, ultra]
        options:
          reasoning_effort: medium
      - id: cursor-cli
        label: Cursor CLI
        provider: cursor-cli
        model_id: composer-2.5
        reasoning_efforts: [low, medium, high, xhigh, max]
        options:
          reasoning_effort: high
      - id: pi-cli
        label: Pi CLI
        provider: pi-cli
        model_id: google/gemini-3.8-flash
        reasoning_efforts: [low, medium, high, xhigh]
        options:
          reasoning_effort: high
      - id: muse-cli
        label: Muse
        provider: muse-cli
        model_id: muse-spark-1.3
        reasoning_efforts: [medium, high, xhigh, max]
        options:
          reasoning_effort: max
      - id: agy-cli
        label: Antigravity CLI (Alpha)
        provider: agy-cli
        model_id: gemini-3.8-flash-high
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: high
    # The default option is also declared in the common runtime fields so the
    # shared composer can show the correct runtime before the first turn.
    provider: claude-code
    model_id: claude-sonnet-5-5
    # Keep all project access on AgentWorks' governed MCP bridge. Coding CLIs
    # provide the model and conversation runtime without exposing their native
    # shell, file, search, or interactive-question tools.
    agent_tools:
      mode: mcp_only
    approvals:
      mode: provider_auto
    sandbox:
      # Bridge tools run inside the server-enforced workspace guard.
      mode: strict
      network: allowed
      read_only: []
      # No account-wide chat_history/: it indexes every product's chats
      # (workflows, other Crews), so a Crew could read and
      # quote conversations that are not its own. A Crew's own history lives
      # in its project (builder/conversation/), which it can already read;
      # the server persists chat logs itself, not through the shell.
      chat_history: none
    workspace:
      # New projects are created below this per-user root, exactly like the
      # AgentWorks folder lifecycle with workflow.json as the shared runtime manifest.
      mode: project
      projects_root: Crew
      placement:
        execute_shell_command:
          - Put newly created application and source-code files under code/ by default.
          - Preserve an existing repository layout; do not move established files merely to satisfy the default.
        diff_patch_workspace_file:
          - Put newly created application and source-code files under code/ by default.
          - Keep project metadata, documentation, and platform-managed folders at the project root when appropriate.
          - Preserve an existing repository layout; do not move established files merely to satisfy the default.
    conversation:
      # A project owns one canonical persistent chat. Older conversation files
      # remain read-only history; runtime replacement or live CLI reaping does
      # not change the project's conversation identity.
      mode: keyed
      key_type: project
    capabilities:
      # Crew has no workflows: no plans, phases, steps, or execution.
      workflow_execution: disabled
  built_in: true

branding:
  icon: work
  favicon: ""

ui:
  tips:
    - id: dashboards-library
    - id: quick-switcher
    - id: reminders
    - id: project-schedules-create
    - id: project-schedules-manage
    - id: project-dashboard-create
    - id: project-dashboard-update
    - id: toolbar-hide
  surface: work
  files_panel: true
  workflow_panel: false
  secrets: true
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""

# Shared runtime instruction sections admitted by this product.
# A new section must be declared here before it is attached to chat.
instruction_sections:
  - authenticated-user
  - workspace-map
  - project-memory
  - agentworks-agent
  - product-features
  - llm-capability
  - workflow-context
  - work-folders
  - channel-formatting
  - browser-pointer
  - grants
  - cli-tool-environment
  - clarification
  - native-subagents
  - native-shell-off
  - native-shell-on
