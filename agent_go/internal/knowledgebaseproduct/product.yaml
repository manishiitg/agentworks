schema_version: 2
dependencies: {}
prompt:
  file: prompts/access-builder.md
profile:
  id: knowledgebase
  name: Brain
  version: 1
  scope: project
  tools:
    - id: knowledgebase.manage-access
    - id: knowledgebase.git
  tool_policy:
    mode: allowlist
    enabled: [brain_access, brain_backup, list_secrets, manage_global_secret, brain_browse, brain_read, brain_update, brain_skills, brain_schedule]
  # Curator command (PLAT-618): /organize suggests ways to organize (products, teams, entities, timeline), the person
  # picks, then it restructures and merges duplicates with the person's own folder roles.
  commands:
    - name: organize
      description: Organize a Brain folder or the whole Brain your way; suggests ways (products, teams, entities, timeline) and merges duplicates
      icon: brain
      file: commands/organize.md
  runtime:
    transport: structured
    bridge_tools: [brain_access, brain_backup, list_secrets, manage_global_secret, brain_browse, brain_read, brain_update, brain_skills, brain_schedule]
    api_transport: {mode: disabled}
    agent_tools: {mode: mcp_only}
    workspace: {mode: fixed, root: Chats/Knowledgebase}
    conversation: {mode: singleton}
    sandbox:
      mode: strict
      network: allowed
      read_only: []
      chat_history: none
    # Every coding CLI, as for Code: each runs here in mcp_only mode (no native tools, no personal MCP config).
    # Offering only Codex and Pi left the picker empty on servers where neither is signed in (RTS, 2026-10-06).
    provider: claude-code
    model_id: claude-sonnet-5-5
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5-5
        reasoning_efforts: [low, medium, high, max]
        options:
          reasoning_effort: high
        default: true
      - id: codex-cli
        label: Codex
        provider: codex-cli
        model_id: gpt-6-astra
        reasoning_efforts: [low, medium, high, xhigh, max, ultra]
        options:
          reasoning_effort: medium
      - id: cursor-cli
        label: Cursor CLI
        provider: cursor-cli
        model_id: auto
        reasoning_efforts: [low, medium, high, xhigh, max]
        options:
          reasoning_effort: high
      - id: pi-cli
        label: Pi CLI
        provider: pi-cli
        model_id: google/gemini-3.8-flash
        reasoning_efforts: [low, medium, high, xhigh]
        options:
          reasoning_effort: high
      - id: muse-cli
        label: Muse
        provider: muse-cli
        model_id: muse-spark-1.3-contributor
        reasoning_efforts: [medium, high, xhigh, max]
        options:
          reasoning_effort: max
      - id: agy-cli
        label: Antigravity CLI (Alpha)
        provider: agy-cli
        model_id: gemini-3.8-flash-high
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: high
    capabilities:
      workflow_execution: disabled
      raw_terminal: disabled
      browser: disabled
      secrets: disabled
      mcp_selection: disabled
      skill_selection: disabled
      workflow_references: disabled
      voice: disabled
      live_input: disabled
      warm_session: disabled
  ui_panels:
    schedules: true
  # Organize Brain on a cadence (PLAT-618). Off until a person turns it on; each person sets their own cadence and
  # message (what the run does: scope, mode, apply or only propose) from the Brain chat. Brain schedules always run in
  # the person's Brain chat (owner: "keep schedules in chat only always for brain"), as that person, so a run can only
  # change folders they can edit.
  schedules:
    - id: organize
      name: Organize Brain
      description: Tidies Brain the way /organize does (structure, duplicates, timeline, indexes), as the schedule's message asks.
      enabled: false
      isolated: false
      cadence_hours: 168
      quiet_minutes: 10
      max_deferral_hours: 12
      messages:
        - "This is the scheduled Organize Brain run; no one may be attending. Organize the whole Brain (only folders this person can edit), following \"Organizing Brain\" in your instructions. Then reply with the report those instructions describe, briefly."
  built_in: true
branding: {icon: book-open, favicon: ""}
ui:
  surface: knowledgebase
  files_panel: false
  workflow_panel: false
  secrets: false
  streaming: structured
workflows: {enabled: [], selected_skills: [], browser_mode: ""}
chat:
  builder:
    prompt: {file: prompts/access-builder.md}
    tools: [brain_access, brain_backup, list_secrets, manage_global_secret, brain_browse, brain_read, brain_update, brain_skills, brain_schedule]
  mcp:
    prompt: {file: prompts/mcp.md}
    external_tools:
      - brain_browse
      - brain_read
      - brain_update
      - brain_backup
      - brain_skills
      - brain_access
