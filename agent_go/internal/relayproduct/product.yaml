schema_version: 2
dependencies: {}

# Relay authoring reuses the workflow Builder runtime, graph canvas, triggers,
# and executor. This manifest owns built-in chat prompts, skills, and tool
# surfaces. An individual Relay's authored step prompts and selected runtime
# integrations remain in its workflow.json and planning/plan.json.
prompt:
  file: prompts/builder.md
  variables: {}

chat:
  builder:
    # Platform MCP uses the same Builder operation lifecycle. Direct Relay
    # calls test the draft or run an immutable version without Run chat.
    external_tools: [create_relay, update_relay, builder_chat, builder_status, builder_reply_input, builder_cancel, builder_file_history, builder_restore_file, get_relay_releases, publish_relay, test_relay, run_relay, get_relay_run]
    prompt:
      file: prompts/builder.md
    skills: [relay-builder]
    tools:
      - execute_shell_command
      - diff_patch_workspace_file
      - get_workflow_config
      - update_workflow_config
      - update_variable
      - list_secrets
      - set_workflow_secret
      - delete_workflow_secret
      - create_plan
      - maintain_plan
      - add_step
      - update_step
      - update_step_config
      - delete_plan_steps
      - change_step_type
      - manage_step_route
      - validate_plan_change
      - execute_step
      - query_step
      - send_step_message
      - stop_step
      - stop_all_executions
      - run_full_workflow
      - list_executions
      - get_relay_releases
      - publish_relay
      # Shared workflow contract migrations (PLAT-431): a Relay owes the
      # runtime migrations (steps, scripts, code layout), never the goal-driven
      # ones nor those for stores a Relay lacks (database, KB, learnings).
      - get_contract_upgrades
      - set_workflow_contract_version
      - set_code_layout_version
      - migrate_message_sequence_code_items
      - migrate_orchestrator_step_type
      - migrate_declared_execution_mode
      - strip_declared_execution_mode
      - get_step_prompts
      - manage_custom_commands
      - get_llm_config
      - manage_workflow_webhook
      - list_mcp_servers
      - search_mcp_catalog
      - add_mcp_server
      - install_mcp_server
      - edit_mcp_server
      - remove_mcp_server
      - trigger_mcp_discovery
      - list_skills
      - search_skills
      - install_skill
      - import_skill
      - uninstall_skill
      - list_gmail_connections
      - update_gmail_connection_grants
      - google_workspace_cli
      - get_notification_history
      - get_cost_summary
      - get_ui_state
      - list_ui_capabilities
      - perform_ui_action
      - get_file_link
      - agent_browser
profile:
  id: relays
  name: Relays
  version: 1
  scope: global
  built_in: true
  commands:
    - name: design-graph
      description: Create or refine the agents, scripts and branches in this Relay
      icon: git-branch
      prompt: |
        Design or refine this Relay's graph using the relay-builder skill and registered plan tools. Read the current workflow.json and planning/plan.json first. Preserve user-authored prompts and per-step model choices. Define INPUT and the designated JSON output agent; validate the graph and describe saved changes. Ask for missing requirements before inventing behavior.
        {{context}}
    - name: test
      description: Test the draft with sample inputs and inspect its JSON output
      icon: check-circle
      prompt: |
        Test this Relay's current draft using the relay-builder skill. Read its INPUT definition and variable groups. Use the supplied sample input, or ask for required values; do not invent production inputs. Validate the graph, run_full_workflow with the configured group_name and serialized variables.INPUT, wait for completion, then inspect the run and final result.json. Report the actual output or failed step and error. Do not publish.
        {{context}}
    - name: publish
      description: Publish the draft as a versioned Relay API
      icon: globe
      prompt: |
        Publish this Relay's current draft as an API version. Follow the relay-builder skill: inspect existing releases with get_relay_releases, validate the draft, then use publish_relay. Report the exact returned version and content hash. Explain how callers select this version while later Builder edits remain in the draft. Do not publish a dashboard or report.
        {{context}}
    - name: versions
      description: Inspect the active and previous published Relay versions
      icon: layers
      prompt: |
        Use get_relay_releases to inspect this Relay's active and previous published API versions. Report the actual versions and hashes returned, and distinguish published versions from the editable draft. Do not publish or edit anything.
        {{context}}
    - name: setup-api
      description: Configure JSON inputs and an API trigger for this Relay
      icon: terminal
      prompt: |
        Configure this Relay's API integration using the relay-builder skill and existing function trigger tools. Inspect workflow.json and variables/variables.json. Define the object INPUT and a default variable group if missing, then configure the function trigger. Explain the authenticated API call, version selection and final JSON output using actual saved configuration and registered guidance; do not invent URLs or credentials. Preserve existing triggers unless asked to change them.
        {{context}}

branding:
  icon: ""
  favicon: ""

ui:
  surface: "workflow"
  files_panel: false
  workflow_panel: true
  secrets: true
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: none
