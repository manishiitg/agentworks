schema_version: 2
dependencies: {}

# Relay authoring is a mode of the workflow-backed AgentWorks Builder. This
# manifest supplies only the product contract; AgentWorks owns the tools,
# access policy, chat history, triggers, graph canvas, and executor.
prompt:
  file: prompts/builder.md
  variables: {}

profile:
  id: relays
  name: Relays
  version: 1
  scope: global
  built_in: true

branding:
  icon: ""
  favicon: ""

ui:
  surface: "workflow"
  files_panel: false
  workflow_panel: true
  secrets: true
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: none
