schema_version: 2
dependencies: {}

# Agent/script chains use inputs and outputs, without workflow DB, KB or learnings.
execution:
  platform_stores: false

# Relay identity/configuration stays in workflow.json; relay.py owns execution.
# This manifest owns Builder prompts, skills and tools.
prompt:
  file: prompts/builder.md
  variables: {}

chat:
  builder:
    # Platform MCP uses the same Builder operation lifecycle. Direct Relay
    # calls test the draft or run an immutable version without Run chat.
    external_tools: [create_relay, update_relay, builder_chat, builder_status, builder_reply_input, builder_cancel, builder_file_history, builder_restore_file, get_relay_releases, publish_relay, test_relay, run_relay, get_relay_run]
    prompt:
      file: prompts/builder.md
    skills: [relay-builder]
    tools:
      - execute_shell_command
      - diff_patch_workspace_file
      - get_workflow_config
      - update_workflow_config
      - update_variable
      - list_secrets
      - set_workflow_secret
      - delete_workflow_secret
      - test_relay
      - get_relay_run
      - get_relay_releases
      - publish_relay
      - manage_custom_commands
      - get_llm_config
      - manage_workflow_webhook
      - call_mcp_tool
      - list_mcp_servers
      - search_mcp_catalog
      - add_mcp_server
      - install_mcp_server
      - edit_mcp_server
      - remove_mcp_server
      - trigger_mcp_discovery
      - list_skills
      - search_skills
      - install_skill
      - import_skill
      - uninstall_skill
      - list_gmail_connections
      - update_gmail_connection_grants
      - google_workspace_cli
      - get_notification_history
      - get_cost_summary
      - get_ui_state
      - list_ui_capabilities
      - perform_ui_action
      - get_file_link
      - agent_browser
profile:
  id: relays
  name: Relays
  version: 1
  scope: global
  built_in: true
  commands:
    - name: build-relay
      description: Create or refine this Relay Python program
      icon: git-branch
      prompt: |
        Design or refine relay.py using the relay-builder skill and existing workspace file tools. Read relay.py, workflow.json and configuration. Use async def run(INPUT, ctx), fresh ctx.call_agent calls, exact authored prompts, tools and explicit return JSON. Preserve user choices. Test with a supplied example before claiming it works.
        {{context}}
    - name: test
      description: Test the draft with sample inputs and inspect its JSON output
      icon: check-circle
      prompt: |
        Test this Relay's current draft using the relay-builder skill. Read its INPUT definition and flat configuration. Use the supplied sample input, or ask for required values; do not invent production inputs. Use test_relay with the sample INPUT object, then get_relay_run to inspect completion, relay_trace.json and returned JSON. Report the actual output or failing Python/agent call. Do not publish.
        {{context}}
    - name: publish
      description: Publish the draft as a versioned Relay API
      icon: globe
      prompt: |
        Publish this Relay's current draft as an API version. Follow the relay-builder skill: inspect existing releases with get_relay_releases, validate the draft, then use publish_relay. Report the exact returned version and content hash. Explain how callers select this version while later Builder edits remain in the draft. Do not publish a dashboard or report.
        {{context}}
    - name: versions
      description: Inspect the active and previous published Relay versions
      icon: layers
      prompt: |
        Use get_relay_releases to inspect this Relay's active and previous published API versions. Report the actual versions and hashes returned, and distinguish published versions from the editable draft. Do not publish or edit anything.
        {{context}}
    - name: setup-api
      description: Configure JSON inputs and an API trigger for this Relay
      icon: terminal
      prompt: |
        Configure this Relay's API integration using the relay-builder skill and existing function trigger tools. Inspect workflow.json and variables/variables.json. Define the object INPUT and flat configuration values in variables[].value if missing, then configure the function trigger. Explain the authenticated API call, version selection and final JSON output using actual saved configuration and registered guidance; do not invent URLs or credentials. Preserve existing triggers unless asked to change them.
        {{context}}

branding:
  icon: ""
  favicon: ""

ui:
  surface: "workflow"
  files_panel: false
  workflow_panel: true
  secrets: true
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: none
