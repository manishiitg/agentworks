schema_version: 2

# Code is a private coding workspace. It is a second definition over the same
# shared features as Crew (internal/workproduct), not a copy: a subset of
# features with narrower options, a plain coding prompt, and no identity.
# See docs/design/code_product.md.
dependencies: {}

prompt:
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: code
  name: Code
  version: 1
  features:
    - live-chat
    - coding
    - files
    - browser
    - secrets
    # This Code's own connections, added with its owner's login
    # (docs/design/personal_mcp_attach.md): a Code is a place like a Crew.
    # scope personal: the agent gets only manage_my_mcp_servers, never the tools
    # that create connections shared with everyone.
    - id: mcp
      options: {scope: personal}
    - skills
    - knowledgebase
    - attached-folders
    - id: workflow-references
      # A Code calls accessible Crews/workflows and can exchange private
      # functions with other Codes owned by the same account.
      options: {direction: code_peers}
    - terminal
    - models
    - id: bots
      # 1:1 only. Slack: the Code's own dedicated app, DMs only (people with
      # owner access, in their own chat); never the shared bot
      # or a channel. WhatsApp: the owner only, like every WhatsApp pairing.
      # gmail: own -- Google accounts (gog: Gmail, Drive, Calendar, Docs, Sheets,
      # Slides) connected in this Code only, private to it and usable only in its
      # owner's chats; never the shared accounts. Restored 2026-09-30: Google's
      # Workspace MCP servers are a Developer Preview that needs Google-side
      # enrollment, while the gog integration works with a normal OAuth client.
      options: {channels: "slack,whatsapp", dm_only: "true", gmail: own}
    # A schedule or webhook trigger sends one message to the Code's chat. Only
    # the Code's owner creates them, and they run as the owner (their own
    # chat, MCP connections and secrets). docs/design/code_product.md.
    - id: schedules
      options: {mode: message_only}
    - id: triggers
      options: {mode: message_only}
    - dashboard
    # No project Memory (user, 2026-09-28): a Code keeps notes in its files.
    - costs
    - background-work
    - workspace-ui
  # project scope for the same reason as Crew: provider_options stay
  # authoritative and this profile's own prompt.file reaches the model.
  scope: project
  tools:
    - id: code.create-project
      interaction:
        kind: project_created
        render: product.refresh
    - id: code.custom-commands
  tool_policy:
    mode: allowlist
    enabled:
      - get_file_link
      - get_report_link
      # The person's own MCP connections (registered for Code turns only).
      - manage_my_mcp_servers
      # Vault MCP connections and group access, for an active administrator only (rechecked on every call, PLAT-503).
      - manage_vault_access
      # Any account: create vaults and share MCP connections through them (owner-checked by the Vault service).
      - manage_my_vaults
  runtime:
    transport: auto
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5-5
        reasoning_efforts: [low, medium, high, max]
        options:
          reasoning_effort: high
        default: true
      - id: codex-cli
        label: Codex
        provider: codex-cli
        model_id: gpt-6-astra
        reasoning_efforts: [low, medium, high, xhigh, max, ultra]
        options:
          reasoning_effort: medium
      - id: cursor-cli
        label: Cursor CLI
        provider: cursor-cli
        model_id: auto
        reasoning_efforts: [low, medium, high, xhigh, max]
        options:
          reasoning_effort: high
      - id: pi-cli
        label: Pi CLI
        provider: pi-cli
        model_id: google/gemini-3.8-flash
        reasoning_efforts: [low, medium, high, xhigh]
        options:
          reasoning_effort: high
      - id: muse-cli
        label: Muse
        provider: muse-cli
        model_id: muse-spark-1.3-contributor
        reasoning_efforts: [medium, high, xhigh, max]
        options:
          reasoning_effort: max
      - id: agy-cli
        label: Antigravity CLI (Alpha)
        provider: agy-cli
        model_id: gemini-3.8-flash-high
        reasoning_efforts: [low, medium, high]
        options:
          reasoning_effort: high
    provider: claude-code
    model_id: claude-sonnet-5-5
    # The profile's base mode, as for Crew. Every Code chat switches to
    # native agent tools (hybrid) through the Code's "Native agent tools"
    # switch, which is on unless the Code turned it off (owner decision
    # 2026-09-28). Known exposure until the CLIs are confined (PLAT-364
    # part 2): their own read tools can reach files outside the Code.
    agent_tools:
      mode: mcp_only
    approvals:
      mode: provider_auto
    sandbox:
      mode: strict
      network: allowed
      read_only: []
      chat_history: none
    workspace:
      # Private: under the owner's own tree, never the shared Crew/<id> root.
      mode: project
      projects_root: Chats/Code/projects
      # No placement rules: the person organises their workspace however they
      # want (user, 2026-09-29).
    conversation:
      mode: keyed
      key_type: project
    capabilities:
      workflow_execution: disabled
      # The mic in Code's composer (owner 2026-10-03: on for Code on Excellence). It shows only where the server also has the speech
      # engine (capabilities.voice.available, a cgo build); the speech model is a one-time download the composer offers on first use.
      voice: preferred
  built_in: true
  # Admins can open every user's Code read-only, and every view is audited
  # (docs/design/code_product.md, "Admin inspection").
  admin_inspection: true

branding:
  icon: code
  favicon: ""

ui:
  surface: code
  files_panel: true
  workflow_panel: false
  secrets: true
  streaming: auto

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""

instruction_sections:
  - workspace-map
  # No project-memory: a Code has no platform MEMORY.md convention; the
  # person decides how to keep notes.
  - product-features
  - llm-capability
  - workflow-context
  - work-folders
  - channel-formatting
  - browser-pointer
  - grants
  - cli-tool-environment
  - clarification
  - native-subagents
