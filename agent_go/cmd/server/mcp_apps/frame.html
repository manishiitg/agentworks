<!doctype html><html><head><meta charset="utf-8"></head><body><script>
addEventListener('message', function receive(event) {
  if (event.source !== parent || event.data?.kind !== 'agentworks-dashboard-document' || typeof event.data.html !== 'string') return;
  removeEventListener('message', receive);
  document.open(); document.write(event.data.html); document.close();
});
</script></body></html>
