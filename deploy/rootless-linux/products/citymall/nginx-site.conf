# Citymall: nginx in front of the app's gateway (127.0.0.1:25080). The gateway, not the agent (25000), is the public entry
# on every deployment: it serves the frontend, checks the per-user token and stamps X-User-ID before /api/wp reaches the
# workspace, so nginx must never proxy to 25000/25001 directly.
# Installed by setup-citymall-host.sh (run by ./deploy.sh citymall) as /etc/nginx/sites-available/citymall.
# Plain HTTP on the IP and the domain for now; once DNS points at this box and 80/443 are open:
#   sudo certbot --nginx -d agents.citymall.live      (see deploy/rootless-linux/citymall.md)
map $http_upgrade $citymall_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name agents.citymall.live _;

    # File uploads and attachments.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:25080;
        proxy_http_version 1.1;
        # WebSockets (live terminals, chat streams).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $citymall_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # not appended: the gateway trusts the first entry
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events and long agent turns: no buffering, long timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
}
