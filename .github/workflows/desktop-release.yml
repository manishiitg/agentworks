name: Desktop DMG

# Native builders keep the app, speech libraries and bundled CLI helpers on
# the same CPU architecture. The owner's laptop is never a release builder.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-dmg-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            goarch: arm64
          - runner: macos-15-intel
            arch: x64
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Test desktop onboarding
        run: |
          cd frontend
          npm test -- src/components/WelcomeHome.test.tsx src/components/HomeAgentModel.test.tsx src/products/work/CreateCrewWizard.test.tsx src/products/work/crewOnboarding.test.ts
      - name: Build frontend static assets
        env:
          VITE_DEPLOYMENT_MODE: local
        run: |
          cd frontend
          npm run build
          cd ..
          rm -rf agent_go/static
          mkdir -p agent_go/static
          cp -R frontend/dist/. agent_go/static/
      # Use the dependency versions recorded by the release, never dependency main.
      - name: Download pinned Go dependencies
        run: |
          cd agent_go
          go mod download
          go list -m github.com/manishiitg/mcpagent github.com/manishiitg/multi-llm-provider-go
      - name: Build native servers and speech libraries
        run: |
          bash scripts/build-darwin-voice-binary.sh agent_go desktop/resources/agent-server '${{ matrix.goarch }}'
          cd workspace
          go mod download
          GOOS=darwin GOARCH='${{ matrix.goarch }}' go build -o ../desktop/resources/workspace-server .
      - name: Bundle native CLI and platform helpers
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export AGENTWORKS_APP_VERSION="${GITHUB_REF#refs/tags/v}"; fi
          bash scripts/build-desktop-helpers.sh
      - name: Test combined installer and updater
        run: node --test packages/app/test/installer.test.mjs desktop/lib/updateInstaller.test.js
      - name: Package Mac app
        run: |
          MAC_MINIMUM="$(python3 scripts/desktop-minimum-os.py desktop/resources)"
          cd desktop
          npm ci
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            npm pkg set version="$VERSION"
          fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.minimumSystemVersion="$MAC_MINIMUM"
          cd dist
          for asset in *.dmg *.zip; do shasum -a 256 "$asset" > "$asset.sha256"; done
      - name: Verify packaged native architecture and actual DMG installation
        run: |
          bash scripts/verify-desktop-package.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: AgentWorks-mac-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # Publish only after BOTH architectures passed. A stable release must never
  # become visible to the installer with only one architecture uploaded.
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AgentWorks-mac-*
          path: dist
          merge-multiple: true
      - name: Publish combined Mac release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "AgentWorks $VERSION" --generate-notes
          fi
          gh release upload "v$VERSION" dist/*.dmg dist/*.zip dist/*.sha256 --clobber
          # Old Apple silicon installations use the former product name.
          cp "dist/AgentWorks-$VERSION-arm64.dmg" "dist/Runloop-$VERSION-arm64.dmg"
          gh release upload "v$VERSION" "dist/Runloop-$VERSION-arm64.dmg" --clobber
          gh release edit "v$VERSION" --draft=false --latest
