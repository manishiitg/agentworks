name: Verify change

# Agents verify a change here instead of building on the owner's laptop
# (owner, 2026-10-07): commit, run scripts/verify-remote.sh, and push to main
# only when this passes. Tests to run are named in the head commit message:
#   Verify-Test: ./cmd/server -run '^TestCodeChatAsk'
#   Verify-Vitest: src/components/PanelSwitcher.test.tsx
#   Verify-Frontend-Build: true
#   Verify-Browser: scripts/test-mcp-offers-browser.mjs
#   Verify-Deploy: deploy/common/test_install_coding_clis.py
on:
  push:
    branches: ['verify/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sdks:
    if: contains(github.event.head_commit.message, 'Verify-Native-SDKs: true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOWORK: "off"
      AGENTWORKS_TEST_REAL_CODING_SDKS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: agent_go/go.mod
      - name: Install and import the real SDKs through the embedded provisioner
        working-directory: agent_go
        run: go test -v ./internal/codingsdks -count=1

  arm-release:
    if: >-
      contains(github.event.head_commit.message, 'Verify-ARM-Release: true')
    uses: ./.github/workflows/build-native-release.yml
    with:
      arch: arm64

  darwin-live:
    if: >-
      contains(github.event.head_commit.message, 'Verify-Darwin-Live: true')
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: agent_go/go.mod
          cache-dependency-path: agent_go/go.sum
      - name: Build local runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-artifacts
          (cd agent_go && go mod download && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.cliVersion=$GITHUB_SHA" -o ../runtime-artifacts/agentworks ./cmd/agentworks)
          bash scripts/build-darwin-voice-binary.sh agent_go runtime-artifacts/agent-server arm64
          (cd workspace && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../runtime-artifacts/workspace-server .)
          (cd mcp-gateway && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../runtime-artifacts/vault-server ./cmd/server)
          cp -R plugins runtime-artifacts/plugins
          printf '%s\n' "$GITHUB_SHA" > runtime-artifacts/revision.txt
          (cd runtime-artifacts && shasum -a 256 agentworks agent-server workspace-server vault-server > SHA256SUMS)
          tar -czf agentworks-darwin-live.tar.gz runtime-artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: agentworks-darwin-live
          path: agentworks-darwin-live.tar.gz
          retention-days: 3

  # Real macOS proof for the Cursor CLI identity: a copied Node binary run through a
  # launcher-shaped process, verified by the kernel launch record. Request it with
  # "Verify-Darwin-Cursor: true" in the commit message.
  darwin-cursor:
    if: >-
      contains(github.event.head_commit.message, 'Verify-Darwin-Cursor: true')
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: agent_go/go.mod
          cache-dependency-path: agent_go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cursor CLI identity on macOS
        working-directory: agent_go
        run: go test ./cmd/agentworks -run '^(TestCursorNativeProcessAndDiscovery|TestCursorProcArgsPrefixReadsOnlyTheLaunchPrefix)$' -count=1 -v
      - name: Muse Monitor reader on macOS
        working-directory: agent_go
        run: go test ./pkg/agentworksclient -run '^TestMuseMonitorReaderEndsWithItsBroker$' -count=1 -v

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: What changed against main
        id: changed
        run: |
          git fetch -q origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --name-only "$base" HEAD > changed.txt
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "files:"; cat changed.txt
          git log -1 --format=%B > message.txt
          # A named regression still runs after this commit has landed on main.
          echo "go=$({ grep -qE '^(agent_go|workspace|mcp-gateway)/' changed.txt || grep -q '^Verify-Test:' message.txt; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$({ grep -q '^frontend/' changed.txt || grep -q '^Verify-Vitest:' message.txt; } && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.changed.outputs.go == 'true'
        with:
          go-version-file: agent_go/go.mod
          cache-dependency-path: agent_go/go.sum

      - name: Go build and vet
        if: steps.changed.outputs.go == 'true'
        working-directory: agent_go
        env:
          GOWORK: "off"
        run: |
          go build ./...
          pkgs="$(sed -n 's#^agent_go/\(.*\)/[^/]*\.go$#./\1#p' ../changed.txt | sort -u)"
          # Deleted packages have no source left to vet.
          existing_pkgs=""
          for pkg in $pkgs; do
            if [ -d "$pkg" ]; then existing_pkgs="$existing_pkgs $pkg"; fi
          done
          if [ -n "$existing_pkgs" ]; then go vet $existing_pkgs; fi

      # The macOS CLI files carry build tags, so the Linux build above never
      # compiles them. Cross-compile and vet the CLI for both Mac architectures so a
      # darwin-only mistake fails here and not on the owner's laptop.
      - name: Deployment checks named in the commit
        if: contains(github.event.head_commit.message, 'Verify-Deploy:')
        run: |
          set -euo pipefail
          grep -E '^Verify-Deploy:' message.txt | sed 's/^Verify-Deploy:[[:space:]]*//' > deploy-tests.txt
          while IFS= read -r file; do
            [[ "$file" =~ ^deploy/(common|rootless-linux)/test_[a-z0-9_]+\.py$ && -f "$file" ]] || { echo "Invalid deployment check: $file"; exit 1; }
            python3 "$file"
          done < deploy-tests.txt

      - name: Cross-build and vet the CLI for macOS
        if: steps.changed.outputs.go == 'true'
        working-directory: agent_go
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" go build -o /dev/null ./cmd/agentworks
            GOOS=darwin GOARCH="$arch" go vet ./cmd/agentworks ./pkg/agentworksclient
          done

      # Lint only what this change adds (unused code, vet, ineffassign,
      # errorlint per agent_go/.golangci.yml); main's existing issues are
      # not this change's to fix.
      - name: Go lint (new issues only)
        if: steps.changed.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v8
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: agent_go
          args: --new-from-rev=${{ steps.changed.outputs.base }} --timeout=15m ./...

      - name: Build the workspace sandbox launcher for runtime tests
        if: steps.changed.outputs.go == 'true'
        working-directory: workspace
        env:
          GOWORK: "off"
        run: |
          go build -o "$RUNNER_TEMP/video-studio-landlock-runner" ./cmd/landlock-runner
          echo "AGENTWORKS_LANDLOCK_RUNNER=$RUNNER_TEMP/video-studio-landlock-runner" >> "$GITHUB_ENV"

      - name: Go tests named in the commit
        if: steps.changed.outputs.go == 'true'
        working-directory: agent_go
        env:
          GOWORK: "off"
        run: |
          grep -E '^Verify-Test:' ../message.txt | sed 's/^Verify-Test:[[:space:]]*//' > ../tests.txt || true
          if [ ! -s ../tests.txt ]; then echo "No Verify-Test lines; build and vet only."; exit 0; fi
          while IFS= read -r line; do
            echo "::group::go test $line"
            case "$line" in
              'workspace '*|'mcp-gateway '*)
                module="${line%% *}"
                args="${line#* }"
                (cd "../$module" && eval "go test $args -count=1") ;;
              *) eval "go test $line -count=1" ;;
            esac
            echo "::endgroup::"
          done < ../tests.txt

      - uses: actions/setup-node@v6
        if: steps.changed.outputs.frontend == 'true'
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type check and tests named in the commit
        if: steps.changed.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          files="$(grep -E '^Verify-Vitest:' ../message.txt | sed 's/^Verify-Vitest:[[:space:]]*//' | tr '\n' ' ')"
          if [ -n "${files// }" ]; then npx vitest run $files; else echo "No Verify-Vitest lines; type check only."; fi

      - name: Ticket check
        if: hashFiles('scripts/tickets.py') != ''
        run: python3 scripts/tickets.py check

      - name: Shared messaging skills match their source
        if: hashFiles('scripts/sync-agent-messaging-skills.py') != ''
        run: python3 scripts/sync-agent-messaging-skills.py --check

      # The pinned Playwright installer stalls after downloading Chromium on Node 26.
      # Keep product validation on Node 26 and use the proven browser runtime here.
      - name: Set up browser runner
        if: >-
          steps.changed.outputs.frontend == 'true' && contains(github.event.head_commit.message, 'Verify-Browser:')
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Chromium checks named in the commit
        if: >-
          steps.changed.outputs.frontend == 'true' && contains(github.event.head_commit.message, 'Verify-Browser:')
        working-directory: frontend
        env:
          BROWSER_CHECK_ARTIFACT_DIR: ${{ runner.temp }}/browser-check-artifacts
        run: |
          # Keep the browser runner separate from the app's locked dependency tree.
          runtime="$RUNNER_TEMP/browser-runtime"
          mkdir -p "$runtime"
          printf '%s\n' '{"private":true}' > "$runtime/package.json"
          npm install --prefix "$runtime" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          ln -s "$runtime/node_modules/playwright" node_modules/playwright
          "$runtime/node_modules/.bin/playwright" install --with-deps chromium
          grep -E '^Verify-Browser:' ../message.txt | sed 's/^Verify-Browser:[[:space:]]*//' > ../browser-tests.txt
          while IFS= read -r file; do
            [[ "$file" == scripts/test-*-browser.mjs && -f "$file" ]] || { echo "Invalid browser check: $file"; exit 1; }
            node "$file"
          done < ../browser-tests.txt

      - uses: actions/upload-artifact@v6
        if: >-
          always() && contains(github.event.head_commit.message, 'Verify-Browser:')
        with:
          name: frontend-browser-checks
          path: ${{ runner.temp }}/browser-check-artifacts
          if-no-files-found: ignore

      - name: Restore product build runtime
        if: >-
          steps.changed.outputs.frontend == 'true' && contains(github.event.head_commit.message, 'Verify-Frontend-Build: true')
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Frontend production build and bundle budget
        if: >-
          steps.changed.outputs.frontend == 'true' && contains(github.event.head_commit.message, 'Verify-Frontend-Build: true')
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v6
        if: >-
          steps.changed.outputs.frontend == 'true' && contains(github.event.head_commit.message, 'Verify-Frontend-Build: true')
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # Windows: runs only when the commit names tests for it. Each line is "Verify-Windows-Test: <directory> <go test arguments>",
  # for example: Verify-Windows-Test: workspace ./localfiles -run '^TestWindowsShell'. The CLI is always built for Windows.
  windows:
    if: contains(github.event.head_commit.message, 'Verify-Windows-Test:')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: agent_go/go.mod
          cache-dependency-path: agent_go/go.sum
      - name: Build the CLI for Windows
        shell: bash
        working-directory: agent_go
        env:
          GOWORK: "off"
        run: |
          go build -o agentworks.exe ./cmd/agentworks
          ./agentworks.exe version
      - name: Windows tests named in the commit
        shell: bash
        env:
          GOWORK: "off"
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$COMMIT_MESSAGE" | grep -E '^Verify-Windows-Test:' | sed 's/^Verify-Windows-Test:[[:space:]]*//' > tests.txt || true
          while IFS= read -r line; do
            dir="${line%% *}"; args="${line#* }"
            echo "::group::(cd $dir) go test $args"
            (cd "$dir" && eval "go test $args -count=1")
            echo "::endgroup::"
          done < tests.txt
