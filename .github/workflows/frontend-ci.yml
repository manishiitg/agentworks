name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match desktop-release.yml: the tests rely on Node 25+ behaviour.
          node-version: 26
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Typecheck
        run: cd frontend && npx tsc -b

      - name: Test
        run: cd frontend && npm test

  # Catch a bundle-budget break at the commit that causes it, even when the
  # unit tests fail: the production build runs check:bundle-budget and prints
  # the measured eager size; the explicit second check keeps enforcing it even
  # if the build script ever drops it. Node 26 matches verify-remote so sizes
  # are comparable.
  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Production build and bundle budget
        run: cd frontend && npm run build && npm run check:bundle-budget
