name: Coding CLI P0

on:
  push:
    branches: [main]
    paths:
      - "agent_go/**"
      - "scripts/run-coding-cli-p0.sh"
      - ".github/workflows/coding-cli-p0.yml"
      # The ticket-register integrity check below guards a docs-only failure
      # mode, so a docs-only change has to be able to trigger this workflow.
      - "docs/bugs/pulse_platform/index.md"
      - "docs/bugs/pulse_platform/**"
  pull_request:
    paths:
      - "agent_go/**"
      - "scripts/run-coding-cli-p0.sh"
      - ".github/workflows/coding-cli-p0.yml"
      # The ticket-register integrity check below guards a docs-only failure
      # mode, so a docs-only change has to be able to trigger this workflow.
      - "docs/bugs/pulse_platform/index.md"
      - "docs/bugs/pulse_platform/**"
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated live CLI providers, or all"
        required: false
        default: "all"
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

jobs:
  deterministic-contracts:
    name: Coding CLI deterministic contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coding-agent-loop
        uses: actions/checkout@v6
        with:
          path: coding-agent-loop
      - name: Checkout mcpagent
        uses: actions/checkout@v6
        with:
          repository: manishiitg/mcpagent
          path: mcpagent
      - name: Checkout llm-provider-mcp
        uses: actions/checkout@v6
        with:
          repository: manishiitg/llm-provider-mcp
          path: multi-llm-provider-go
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            coding-agent-loop/agent_go/go.sum
            multi-llm-provider-go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coding-agent-loop/frontend/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci --prefix coding-agent-loop/frontend

      - name: Install tmux for hermetic lifecycle contracts
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Verify production follows coding dependency main branches
        working-directory: coding-agent-loop
        run: ./agent_go/scripts/check-production-dependency-refs.sh

      - name: Verify coding CLI registry
        working-directory: coding-agent-loop
        run: >-
          go -C ../multi-llm-provider-go test .
          -run 'TestActiveCodingAgentProvidersSatisfyP0Contract|TestCodingAgentCertificationReferencesExistingTests|TestCodingAgentP0ReleaseMatrix'
          -count=1

      - name: Verify provider cleanup and terminal metadata contracts
        working-directory: coding-agent-loop
        run: |
          go -C ../multi-llm-provider-go test ./pkg/adapters/picli -run '^TestPiBoundedCleanupUsesSharedTmuxKillDelay$' -count=1
          go -C ../mcpagent test ./agent -run '^TestFinishStreamingTerminalEndIncludesRetentionMetadata$' -count=1

      - name: Verify AGY promptless terminal recovery
        working-directory: coding-agent-loop
        run: |
          go -C ../multi-llm-provider-go test ./pkg/adapters/agycli -run '^Test(AgyLaunchOnlyDoesNotRequireHumanPrompt|AgyInteractiveEffortMustMatchModel)$' -count=1
          go -C ../mcpagent test ./agent -run '^TestRestoredAgyTransportLaunchEnablesInteractiveLane$' -count=1

      - name: Verify Claude multiline live-input submission
        working-directory: coding-agent-loop
        run: >-
          go -C ../multi-llm-provider-go test ./pkg/adapters/claudecode
          -run '^TestClaudePromptPasteChipSettlesWhileActiveTurnRepaints$'
          -count=1

      - name: Verify mandatory canonical turn lifecycle
        working-directory: coding-agent-loop
        run: >-
          go -C ../mcpagent test ./agent
          -run '^TestP0CanonicalTurnContract$'
          -count=1

      - name: Verify product tool, skill, and prompt declarations
        working-directory: coding-agent-loop
        run: >-
          go -C agent_go test ./cmd/server
          -run '^Test(AgentWorksProductSurfaceE2E|CrewProductSurfaceE2E|ProductSurfaceGuardRejectsUndeclaredAdditions|WorkflowUpgradePromptsOnlyCallScheduledBuilderTools|ExplicitUpgradeToolReferencesFindsHiddenNativeName|SlackRouteToolAcceptsAuthenticatedCLIBridgeOwner)$'
          -count=1

      - name: Verify product CLI model and reasoning selections
        working-directory: coding-agent-loop
        run: |
          go -C agent_go test ./internal/workproduct ./internal/sparkquillproduct \
            -run '^Test(WorkManifestDeclaresProjectScopeAndCodingAllowlist|EveryProviderOptionDeclaresAnOwnReasoningEffort|SparkQuillDefaultModelsAndReasoningEfforts)$' -count=1
          go -C agent_go test ./cmd/server \
            -run '^Test(CrewAgyHighEffortChatRequest|ProfileQueryReasoningEffortMustBeDeclared)$' -count=1

      - name: Verify execution-principal topology matrix
        working-directory: coding-agent-loop
        run: >-
          go -C agent_go test ./cmd/server
          -run '^Test(ToolExecutionContextTopologyMatrix|WorkflowAccessModeMatrix)$'
          -count=1

      - name: Verify shell bridge retains failed tool diagnostics
        working-directory: coding-agent-loop
        run: >-
          go -C agent_go test ./pkg/workspace
          -run '^TestShellBridge(PreservesFailedToolDiagnostics|RetainsSuccessfulAndErrorOnlyResponses)$'
          -count=1

      - name: Verify Slack setup diagnostics
        working-directory: coding-agent-loop
        run: >-
          go -C agent_go test ./cmd/server/services
          -run '^TestSlackConnectionDiagnostics$'
          -count=1

      - name: Verify every direct tool inherits session context
        working-directory: coding-agent-loop
        run: >-
          go -C agent_go test ./pkg/agentwrapper
          -run '^TestEveryToolRegistrationBindsExecutionContext$'
          -count=1

      - name: Verify deterministic delivery and notification contracts
        working-directory: coding-agent-loop
        run: >-
          go -C agent_go test ./cmd/server
          -run 'Test(HandleLiveInputMessageBusyCodingAgentDeliversExactlyOnce|HandleLiveInputMessageCompletionBoundaryChoosesExactlyOneRoute|StartNextTurnFromLiveInputAcknowledgesBeforeQueuedTurnRuns|WorkflowStepCompletionAutoNotificationCarriesCleanFinalMessage|CodingCLILifecycleMatrixHermeticTmux|RetainedSubmissionRecoveryAfterIdleReaperP0|ChatSubmissionKeepsUncertainReceiptWithoutNotDeliveredProof|CanRetryUncertainChatSubmissionUsesClosedNativeTranscriptProof|TerminalOwnerReconciliationRejectsStaleGeneration|TerminalSnapshotExpiryMatrix|CleanupBoundedTmuxKeepsDismissedSnapshotUntilDisplayDeadline|HandleStopSessionCancelsActiveWorkAndPreventsPaneReuse|ResolveLiveAttachRestartRecoveryRequiresMatchingTmuxOwner|TerminalRoutesCompleteTerminalSignalsProviderWaitLoop|TerminalRoutesFailTerminalMarksSnapshotFailed|TerminalRoutesKillTerminalKillsTmuxAndMarksFailed|TerminalRoutesSendDownBypassesStartupReadinessForCompletedLivePane)$'
          -count=1

      # Tickets are docs/bugs/pulse_platform/<product>/<area>/plat-NNN.md with a standard header, and every folder
      # has a generated index.md (no hand-edited register since 2026-10-06; parallel sessions used to drop each
      # other's rows, e.g. 29b1241e dropped PLAT-123). Cheap: reads the docs tree, no deps, no network.
      - name: Verify platform tickets and their generated indexes
        working-directory: coding-agent-loop
        run: python3 scripts/tickets.py check

      - name: Verify frontend live-input submission contract
        working-directory: coding-agent-loop
        run: npm --prefix frontend test -- src/utils/liveInputSubmission.test.ts src/utils/chatSubmitHelpers.test.ts

  real-contract:
    name: P0 live CLI + MCP bridge + workflow
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: [self-hosted, macOS, agentworks-coding-cli]
    timeout-minutes: 240
    steps:
      - name: Checkout coding-agent-loop
        uses: actions/checkout@v6
        with:
          path: coding-agent-loop
      - name: Checkout mcpagent
        uses: actions/checkout@v6
        with:
          repository: manishiitg/mcpagent
          path: mcpagent
      - name: Checkout llm-provider-mcp
        uses: actions/checkout@v6
        with:
          repository: manishiitg/llm-provider-mcp
          path: multi-llm-provider-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            coding-agent-loop/agent_go/go.sum
            multi-llm-provider-go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coding-agent-loop/frontend/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci --prefix coding-agent-loop/frontend

      - name: Run authenticated P0 matrix
        working-directory: coding-agent-loop
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: >-
          ./scripts/run-coding-cli-p0.sh
          --providers "${{ github.event_name == 'workflow_dispatch' && inputs.providers != 'all' && inputs.providers || 'all' }}"
          --server-url "${{ vars.CODING_CLI_P0_SERVER_URL || 'http://localhost:18743' }}"
          --workspace-api "${{ vars.CODING_CLI_P0_WORKSPACE_API_URL || 'http://127.0.0.1:18744' }}"
          --workspace-docs "${{ vars.CODING_CLI_P0_WORKSPACE_DOCS_PATH || format('{0}/coding-agent-loop/workspace-docs', github.workspace) }}"
